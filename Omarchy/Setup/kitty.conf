# Kitty Terminal Configuration
# Premium theme (Catppuccin Mocha style) with transparency & blur.

# --- Typography ---
font_family      JetBrainsMono Nerd Font
bold_family      auto
italic_family    auto
bold_italic_family auto
font_size        11.0

# --- Window Layout ---
window_padding_width 10
remember_window_size  yes
initial_window_width  950
initial_window_height 600
hide_window_decorations no
confirm_os_window_close 0

# --- Transparency & Blur ---
background_opacity 0.60
background_blur 1
dynamic_background_opacity yes

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_bar_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# --- Mouse & Cursor ---
cursor_shape beam
cursor_blink_interval 0.5
detect_urls yes
show_hyperlink_targets yes

# --- Color Scheme (Catppuccin Mocha) ---
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors
# black
color0 #45475a
color8 #585b70
# red
color1 #f38ba8
color9 #f38ba8
# green
color2 #a6e3a1
color10 #a6e3a1
# yellow
color3 #f9e2af
color11 #f9e2af
# blue
color4 #89b4fa
color12 #89b4fa
# magenta
color5 #f5c2e7
color13 #f5c2e7
# cyan
color6 #94e2d5
color14 #94e2d5
# white
color7 #bac2de
color15 #a6adc8

# --- Keybindings ---
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizes
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Dynamic background opacity controls
map ctrl+shift+a>m change_background_opacity +0.05
map ctrl+shift+a>l change_background_opacity -0.05
map ctrl+shift+a>1 change_background_opacity 1.0
map ctrl+shift+a>d change_background_opacity default
