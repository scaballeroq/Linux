# 🚀 Starship Config: Debian Testing (Optimizado con Nerd Fonts y KDE Plasma 6)

# Formato general del prompt (Una sola línea, limpia y con alto contraste)
format = """
$os\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$php\
$cmd_duration\
$line_break\
$character"""

# Tiempo de espera para comandos lentos (git en repositorios enormes)
scan_timeout = 30

# Símbolo del prompt
[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✖](bold red)"

# Icono del SO (Debian Spiral)
[os]
format = "[$symbol]($style) "
style = "bold red"
disabled = false

[os.symbols]
Debian = " "
openSUSE = " "
SUSE = " "
Ubuntu = " "
Arch = "󰣇 "
Fedora = " "
Linux = " "

# Configuración del Directorio
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
read_only_style = "red"

# Rama de Git
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Estado de Git
[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "🤷 "
stashed = "📦 "
modified = "📝 "
staged = '[++\($count\)](green) '
renamed = "👅 "
deleted = "🗑 "

# Lenguajes de Programación
[python]
symbol = "🐍 "
style = "yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "🐹 "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[php]
symbol = "🐘 "
style = "bold blue"
format = "via [$symbol($version )]($style)"

# Duración del último comando (si tarda más de 2 segundos)
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "tomó [$duration]($style) "

# Paquetes y Contenedores
[package]
disabled = true

[docker_context]
symbol = "🐳 "
style = "blue bold"
format = "via [$symbol$context]($style) "
